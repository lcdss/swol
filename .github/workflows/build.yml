name: Build

on:
  push:
    # The release below reuses this same tag. On the workflow_dispatch path
    # the workflow creates it, which cannot re-trigger this workflow because
    # tags made with GITHUB_TOKEN never start workflow runs.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:

# For creating the release and its tag.
permissions:
  contents: write

env:
  # Keep in step with mise.toml and lint.yml.
  FLUTTER_VERSION: 3.47.0

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      # storeFile is resolved relative to android/app, where the signing config
      # lives. compileSdk/targetSdk/minSdk/ndkVersion are in the build file --
      # they used to be injected here, which meant no one could build a clone.
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Flutter (App Bundle)
        run: flutter build appbundle --release

      # The Flutter Gradle Plugin adds 1000 * ABI_VERSION to versionCode here.
      - name: Build Flutter (APK)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v7
        with:
          name: Releases
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          version=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          # Strip the +versionCode: that is Android upgrade bookkeeping, not
          # part of the release name.
          echo "VERSION=${version%%+*}" >> $GITHUB_ENV

      # The trigger tag and the release tag are the same now, so the tag
      # existing proves nothing -- check for the release itself, and skip it
      # on a re-run for an already-released version.
      - name: Check if this version is already released
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ env.VERSION }} already released; bump the version in pubspec.yaml to release again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-x86_64-release.apk,build/app/outputs/bundle/release/app-release.aab"
          tag: v${{ env.VERSION }}
          # The built-in token, so there is no PAT to expire -- the previous one
          # did, and every release silently failed with 401 once it had.
          token: ${{ secrets.GITHUB_TOKEN }}
